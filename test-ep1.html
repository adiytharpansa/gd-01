<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Uji Putar — Chainsaw Man Ep.1 (gd-01)</title>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<style>
  body { margin:0; background:#0F1018; color:#fff; font-family:Poppins,system-ui,sans-serif; }
  .bungkus { max-width:960px; margin:0 auto; padding:16px; }
  video { width:100%; background:#000; border-radius:12px; }
  .hud { margin-top:12px; font-size:14px; line-height:1.9; color:#A6A8B5; }
  .hud b { color:#fff; }
  .pintu { display:flex; flex-wrap:wrap; gap:8px; margin-top:8px; }
  .pintu button { background:#242632; color:#fff; border:1px solid #3a3d52; padding:8px 12px; border-radius:8px; cursor:pointer; }
  .pintu button.aktif { background:#E5222B; border-color:#E5222B; }
</style>
</head>
<body>
<div class="bungkus">
  <h2 style="margin:4px 0 12px">Uji Putar Gudang — Chainsaw Man Episode 1</h2>
  <video id="v" controls playsinline></video>
  <div class="hud">
    <div>Pintu aktif: <b id="hPintu">-</b> · Kualitas: <b id="hKualitas">-</b></div>
    <div>Ter-buffer: <b id="hBuffer">0 dtk</b> · Posisi: <b id="hPosisi">0:00</b> / <b id="hDurasi">-</b></div>
    <div id="hStatus">Memuat…</div>
    <div class="pintu" id="tombolPintu"></div>
  </div>
</div>
<script>
  var COMMIT = 'ecedc6227946713ba0c913ab4bbd2c8fe63b0ba1';
  var JALUR = '127230/1/master.m3u8';
  var PINTU = [
    ['CDN Sendiri', 'https://onimeku-cdn.adiyth-arpansa.workers.dev/gd-01@' + COMMIT + '/' + JALUR],
    ['jsDelivr', 'https://cdn.jsdelivr.net/gh/adiytharpansa/gd-01@' + COMMIT + '/' + JALUR],
    ['Fastly', 'https://fastly.jsdelivr.net/gh/adiytharpansa/gd-01@' + COMMIT + '/' + JALUR],
    ['Gcore', 'https://gcore.jsdelivr.net/gh/adiytharpansa/gd-01@' + COMMIT + '/' + JALUR],
    ['Pages', 'https://adiytharpansa.github.io/gd-01/' + JALUR],
    ['GitHack', 'https://rawcdn.githack.com/adiytharpansa/gd-01/' + COMMIT + '/' + JALUR],
    ['GitHub Raw', 'https://raw.githubusercontent.com/adiytharpansa/gd-01/' + COMMIT + '/' + JALUR]
  ];
  var video = document.getElementById('v');
  var hls = null, pintuAktif = 0, sudahPindah = {};
  var el = function(id){ return document.getElementById(id); };

  function tandaiTombol() {
    document.querySelectorAll('#tombolPintu button').forEach(function(b, i){ b.classList.toggle('aktif', i === pintuAktif); });
  }
  PINTU.forEach(function(p, i){
    var b = document.createElement('button');
    b.textContent = p[0];
    b.onclick = function(){ muat(i, video.currentTime || 0, true); };
    el('tombolPintu').appendChild(b);
  });

  function muat(i, posisi, manual) {
    pintuAktif = i;
    el('hPintu').textContent = PINTU[i][0];
    el('hStatus').textContent = 'Memuat lewat ' + PINTU[i][0] + '…';
    tandaiTombol();
    if (hls) { hls.destroy(); hls = null; }
    if (window.Hls && Hls.isSupported()) {
      hls = new Hls();
      hls.loadSource(PINTU[i][1]);
      hls.attachMedia(video);
      hls.on(Hls.Events.LEVEL_SWITCHED, function(_, d){
        var lv = hls.levels[d.level];
        el('hKualitas').textContent = lv ? (lv.height + 'p') : '-';
      });
      hls.on(Hls.Events.ERROR, function(_, d){
        if (d.fatal && !manual) {
          var berikut = (i + 1) % PINTU.length;
          if (!sudahPindah[berikut]) {
            sudahPindah[berikut] = true;
            el('hStatus').textContent = 'Pintu ' + PINTU[i][0] + ' galat — pindah ke ' + PINTU[berikut][0] + '…';
            muat(berikut, video.currentTime || 0, false);
          }
        }
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = PINTU[i][1];
    }
    video.addEventListener('loadedmetadata', function tangkap(){
      video.removeEventListener('loadedmetadata', tangkap);
      if (posisi > 0) video.currentTime = posisi;
      el('hStatus').textContent = 'Terputar lewat ' + PINTU[i][0];
      video.play().catch(function(){});
    });
  }

  setInterval(function(){
    if (video.duration) {
      var m = Math.floor(video.currentTime / 60), d = Math.floor(video.currentTime % 60);
      el('hPosisi').textContent = m + ':' + String(d).padStart(2, '0');
      var dm = Math.floor(video.duration / 60), dd = Math.floor(video.duration % 60);
      el('hDurasi').textContent = dm + ':' + String(dd).padStart(2, '0');
      var buf = 0;
      for (var i = 0; i < video.buffered.length; i++) {
        if (video.buffered.start(i) <= video.currentTime && video.currentTime <= video.buffered.end(i)) buf = video.buffered.end(i) - video.currentTime;
      }
      el('hBuffer').textContent = buf.toFixed(1) + ' dtk';
    }
  }, 500);

  muat(0, 0, false);
</script>
</body>
</html>
